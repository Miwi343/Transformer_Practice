[project]
name = "transformer-practice"
version = "0.1.0"
description = "Learning transformers from scratch in JAX/Flax and PyTorch"
requires-python = ">=3.12"
dependencies = [
    "jax>=0.4.30",
    "flax>=0.10",
    "optax>=0.2",
    "torch>=2.4",
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transformer_practice"]